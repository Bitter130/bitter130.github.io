<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Devid - About Me</title>
    <link rel="icon" href="profile.png">
        <link rel="stylesheet" href="style.css">
        <style>
        /* =============================================================
           Windows 7 "Aero" design tokens
           ============================================================= */
        :root {
            /* --- Aero window chrome --- */
            --aero-glass-1: #6d7f9e;   /* title bar top */
            --aero-glass-2: #3f5170;   /* title bar bottom */
            --aero-edge: rgba(255, 255, 255, 0.55);
            --aero-edge-dim: rgba(255, 255, 255, 0.22);
            --win-face: #f0f0f0;       /* content pane */
            --win-border: #8a96ab;

            /* --- Win7 control colours --- */
            --ctrl-min: #a8c4e8;
            --ctrl-max: #a8c4e8;
            --ctrl-close: #e9705f;
            --ctrl-close-hi: #f2927f;
            --ctrl-glyph: #1c2b45;
            --ctrl-glyph-light: #fff;

            /* --- Desktop wallpaper (purple, tuned to the pfp) --- */
            --wall-1: #2b7fd4;
            --wall-2: #6b3fa0;
            --wall-3: #12041f;
            --desk-glow: rgba(232, 124, 254, 0.55);

            /* --- Content palette (unchanged from pfp tuning) --- */
            --ink: #1b1024;
            --ink-soft: #4a3a5c;
            --accent: #8b2fc9;
            --accent-deep: #672b89;
            --accent-bright: #e87cfe;
            --highlight: #a8801a;
            --focus: #1e6fd9;

            --ui-font: 'Segoe UI', Tahoma, 'Segoe UI Emoji', system-ui, sans-serif;
            --mono: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
        }

        * {
            box-sizing: border-box;
        }

        html,
        body {
            height: 100%;
        }

        body {
            margin: 0;
            font-family: var(--ui-font);
            color: var(--ink);
            background: var(--wall-3);
            overflow-x: hidden;
        }

        ::selection {
            background: var(--accent-bright);
            color: #fff;
        }

        /* =============================================================
           Desktop + wallpaper
           ============================================================= */
        .desktop {
            position: relative;
            min-height: 100vh;
            padding: 2.5rem 1.5rem 7rem;
            display: flex;
            flex-direction: column;
            align-items: center;
            isolation: isolate;
        }

        /* The Aero "wallpaper + light bloom" look. */
        .desktop::before {
            content: "";
            position: fixed;
            inset: 0;
            z-index: -2;
            background:
                radial-gradient(ellipse 60% 50% at 22% 12%, rgba(232, 124, 254, 0.42) 0%, transparent 62%),
                radial-gradient(ellipse 55% 45% at 82% 22%, rgba(120, 200, 255, 0.30) 0%, transparent 64%),
                radial-gradient(ellipse 90% 70% at 50% 108%, rgba(103, 43, 137, 0.85) 0%, transparent 70%),
                linear-gradient(168deg, var(--wall-1) 0%, var(--wall-2) 48%, var(--wall-3) 100%);
        }

        /* Faint Aero grid sheen. */
        .desktop::after {
            content: "";
            position: fixed;
            inset: 0;
            z-index: -1;
            background-image:
                linear-gradient(rgba(255, 255, 255, 0.05) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255, 255, 255, 0.05) 1px, transparent 1px);
            background-size: 44px 44px;
            mask-image: radial-gradient(ellipse 70% 60% at 50% 40%, #000 0%, transparent 78%);
            -webkit-mask-image: radial-gradient(ellipse 70% 60% at 50% 40%, #000 0%, transparent 78%);
            pointer-events: none;
        }

        .window-layer {
            position: relative;
            width: min(760px, 100%);
            display: flex;
            flex-direction: column;
            gap: 3.25rem;
        }

        /* =============================================================
           Aero window frame
           ============================================================= */
        .win {
            position: relative;
            border-radius: 8px 8px 5px 5px;
            background: var(--win-face);
            padding: 0 0 10px;
            box-shadow:
                0 0 0 1px var(--win-border),
                0 12px 34px rgba(0, 0, 0, 0.45),
                0 2px 6px rgba(0, 0, 0, 0.3);
            /* Inset white "glass" edge that Aero is known for. */
            border-top: 1px solid var(--aero-edge);
            transition: box-shadow 0.25s ease, transform 0.25s ease;
        }

        .win:hover {
            box-shadow:
                0 0 0 1px var(--win-border),
                0 0 26px 0 var(--desk-glow),
                0 18px 44px rgba(0, 0, 0, 0.5),
                0 2px 6px rgba(0, 0, 0, 0.3);
        }

        .win--focus {
            box-shadow:
                0 0 0 1px var(--win-border),
                0 0 32px 2px var(--desk-glow),
                0 22px 54px rgba(0, 0, 0, 0.55),
                0 2px 6px rgba(0, 0, 0, 0.35);
        }

        /* --- Title bar --- */
        .win__bar {
            display: flex;
            align-items: center;
            gap: 8px;
            height: 34px;
            padding: 0 5px 0 9px;
            border-radius: 7px 7px 0 0;
            background: linear-gradient(180deg, var(--aero-glass-1) 0%, var(--aero-glass-2) 100%);
            border-bottom: 1px solid rgba(0, 0, 0, 0.35);
            color: #fff;
            text-shadow: 0 1px 2px rgba(0, 0, 0, 0.65);
            cursor: default;
            user-select: none;
        }

        /* The glass highlight that runs along the top of the title bar. */
        .win__bar::before {
            content: "";
            position: absolute;
            left: 1px;
            right: 1px;
            top: 1px;
            height: 16px;
            border-radius: 7px 7px 12px 12px;
            background: linear-gradient(180deg, rgba(255, 255, 255, 0.42) 0%, rgba(255, 255, 255, 0) 100%);
            pointer-events: none;
        }

        .win__icon {
            width: 16px;
            height: 16px;
            flex-shrink: 0;
            display: grid;
            place-items: center;
            font-size: 11px;
            line-height: 1;
            filter: drop-shadow(0 1px 1px rgba(0, 0, 0, 0.5));
        }

        .win__title {
            flex: 1;
            font-size: 13px;
            font-weight: 600;
            letter-spacing: 0.01em;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        /* --- Caption buttons (Win7 sized up) --- */
        .win__ctrls {
            display: flex;
            gap: 3px;
            flex-shrink: 0;
        }

        .win__btn {
            width: 29px;
            height: 22px;
            display: grid;
            place-items: center;
            border: 1px solid rgba(255, 255, 255, 0.65);
            border-radius: 3px;
            cursor: pointer;
            padding: 0;
            position: relative;
            /* Chrome "glassy" button face */
            background: linear-gradient(180deg, rgba(255, 255, 255, 0.55) 0%, rgba(255, 255, 255, 0.12) 48%, rgba(255, 255, 255, 0.05) 100%);
            box-shadow: inset 0 0 0 1px rgba(0, 0, 0, 0.14), 0 1px 1px rgba(0, 0, 0, 0.28);
            transition: background 0.14s ease, box-shadow 0.14s ease;
        }

        .win__btn::before {
            content: "";
            position: absolute;
            inset: 0;
            border-radius: 2px;
            background: linear-gradient(180deg, rgba(255, 255, 255, 0.7) 0%, rgba(255, 255, 255, 0) 55%);
            pointer-events: none;
        }

        .win__btn:hover {
            background: linear-gradient(180deg, rgba(168, 196, 232, 0.95) 0%, rgba(120, 160, 215, 0.85) 100%);
            box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.8), 0 0 10px rgba(180, 215, 255, 0.9);
        }

        .win__btn:active {
            background: linear-gradient(180deg, rgba(90, 130, 185, 0.95) 0%, rgba(120, 160, 215, 0.9) 100%);
        }

        .win__btn--close:hover {
            background: linear-gradient(180deg, var(--ctrl-close-hi) 0%, var(--ctrl-close) 100%);
            box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.8), 0 0 12px rgba(233, 112, 95, 0.95);
        }

        .win__btn--close:active {
            background: linear-gradient(180deg, #d1543f 0%, var(--ctrl-close) 100%);
        }

        /* Caption glyphs, drawn in CSS so no image assets are needed. */
        .win__btn i {
            position: relative;
            display: block;
            width: 12px;
            height: 10px;
        }

        .win__btn--min i::after {
            content: "";
            position: absolute;
            left: 1px;
            bottom: 0;
            width: 8px;
            height: 2px;
            background: var(--ctrl-glyph);
            box-shadow: 0 1px 0 rgba(255, 255, 255, 0.55);
        }

        .win__btn--max i {
            border: 1px solid var(--ctrl-glyph);
            border-top-width: 2px;
            height: 9px;
            box-shadow: 0 1px 0 rgba(255, 255, 255, 0.5);
        }

        .win__btn--close i::before,
        .win__btn--close i::after {
            content: "";
            position: absolute;
            top: 4px;
            left: 0;
            width: 11px;
            height: 2px;
            background: var(--ctrl-glyph-light);
            border-radius: 1px;
        }

        .win__btn--close i::before { transform: rotate(45deg); }
        .win__btn--close i::after { transform: rotate(-45deg); }

        .win__btn:focus-visible {
            outline: 2px solid #ffd76a;
            outline-offset: 1px;
        }

        /* --- Body --- */
        .win__body {
            padding: 16px 18px 8px;
        }

        .win__body p {
            margin: 0 0 10px;
            font-size: 13.5px;
            line-height: 1.62;
        }

        h2 {
            margin: 0 0 9px;
            font-size: 13px;
            font-weight: 700;
            color: var(--accent-deep);
            letter-spacing: 0.02em;
        }

        /* =============================================================
           Window-specific content
           ============================================================= */

        /* --- Profile window --- */
        .about-top {
            display: flex;
            align-items: center;
            gap: 18px;
        }

        .avatar {
            position: relative;
            width: 104px;
            height: 104px;
            flex-shrink: 0;
            border-radius: 6px;
            overflow: hidden;
            box-shadow: 0 0 0 1px var(--win-border), 0 2px 8px rgba(0, 0, 0, 0.35);
        }

        .avatar img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        .who h1 {
            margin: 0 0 3px;
            font-size: 25px;
            font-weight: 600;
            color: #14101c;
            letter-spacing: -0.01em;
        }

        .who__handle {
            font-family: var(--mono);
            font-size: 12px;
            color: var(--accent-deep);
            background: linear-gradient(180deg, #f6f1fb 0%, #efe6f7 100%);
            border: 1px solid #d6c3e8;
            border-radius: 3px;
            display: inline-block;
            padding: 2px 8px;
            box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.9);
        }

        .who__role {
            margin: 8px 0 0;
            font-size: 12.5px;
            color: var(--ink-soft);
        }

        /* --- Skills --- */
        .skills {
            display: flex;
            flex-wrap: wrap;
            gap: 7px;
        }

        .tag {
            font-family: var(--mono);
            font-size: 12px;
            color: #2c1a3d;
            background: linear-gradient(180deg, #ffffff 0%, #f0e9f7 100%);
            border: 1px solid #b79fd0;
            border-radius: 3px;
            padding: 3px 9px;
            box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.95), 0 1px 2px rgba(0, 0, 0, 0.14);
            cursor: default;
            transition: transform 0.14s ease, box-shadow 0.14s ease, border-color 0.14s ease;
        }

        .tag:hover {
            transform: translateY(-2px);
            border-color: var(--accent-bright);
            box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.95), 0 3px 10px rgba(139, 47, 201, 0.4);
        }

        /* --- Links (Win7 explorer rows) --- */
        .links {
            list-style: none;
            margin: 0;
            padding: 0;
            border: 1px solid #cfc3dc;
            border-radius: 3px;
            overflow: hidden;
            background: #fff;
        }

        .links li + li {
            border-top: 1px solid #e6ddef;
        }

        .links a {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 8px 11px;
            color: var(--ink);
            font-size: 13px;
            text-decoration: none;
            transition: background 0.12s ease;
        }

        .links a:hover {
            background: linear-gradient(180deg, #e8f2ff 0%, #d5e9fb 100%);
            text-decoration: none;
        }

        .links a:focus-visible {
            background: linear-gradient(180deg, #e8f2ff 0%, #d5e9fb 100%);
            outline: 1px dotted var(--focus);
            outline-offset: -2px;
        }

        /* Little "link" glyph. */
        .links .ico {
            width: 16px;
            height: 16px;
            flex-shrink: 0;
            border-radius: 3px;
            background: linear-gradient(135deg, var(--accent-bright), var(--accent) 55%, var(--accent-deep));
            box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.4);
            position: relative;
        }

        .links .ico::after {
            content: "";
            position: absolute;
            inset: 5px;
            border: 1.5px solid rgba(255, 255, 255, 0.9);
            border-radius: 50%;
            border-right-color: transparent;
        }

        .links small {
            margin-left: auto;
            color: #7a6a8c;
            font-family: var(--mono);
            font-size: 11px;
        }

        /* --- Status bar, very Win7 --- */
        .statusbar {
            margin-top: 11px;
            display: flex;
            align-items: center;
            gap: 3px;
            padding-top: 7px;
            border-top: 1px solid #d9cfe4;
        }

        .statusbar span {
            font-size: 11.5px;
            color: var(--ink-soft);
            padding: 2px 9px;
            border: 1px solid #d3c7e0;
            border-radius: 2px;
            background: linear-gradient(180deg, #faf8fc 0%, #f0eaf5 100%);
            box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.9);
        }

        /* =============================================================
           Taskbar
           ============================================================= */
        .taskbar {
            position: fixed;
            left: 0;
            right: 0;
            bottom: 0;
            z-index: 40;
            height: 42px;
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 0 8px;
            background: linear-gradient(180deg, rgba(255, 255, 255, 0.30) 0%, rgba(120, 150, 200, 0.22) 12%, rgba(20, 30, 55, 0.55) 100%);
            border-top: 1px solid rgba(255, 255, 255, 0.4);
            box-shadow: 0 -2px 12px rgba(0, 0, 0, 0.4);
            backdrop-filter: blur(12px) saturate(1.3);
            -webkit-backdrop-filter: blur(12px) saturate(1.3);
        }

        /* Start orb */
        .orb {
            position: relative;
            width: 36px;
            height: 36px;
            flex-shrink: 0;
            border-radius: 50%;
            border: 1px solid rgba(255, 255, 255, 0.65);
            background:
                radial-gradient(circle at 34% 28%, #ffffff 0%, #bfe4a8 22%, #63b04a 48%, #2f7a26 72%, #1c4d15 100%);
            box-shadow:
                inset 0 0 8px rgba(255, 255, 255, 0.75),
                0 0 14px rgba(90, 200, 70, 0.6),
                0 2px 5px rgba(0, 0, 0, 0.5);
            cursor: pointer;
            display: grid;
            place-items: center;
            transition: filter 0.15s ease;
        }

        .orb::before {
            content: "";
            position: absolute;
            inset: 0;
            border-radius: 50%;
            background: linear-gradient(160deg, rgba(255, 255, 255, 0.85) 0%, rgba(255, 255, 255, 0) 52%);
        }

        /* Four-pane Windows flag */
        .orb__flag {
            position: relative;
            width: 15px;
            height: 15px;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 1.5px;
            transform: skewY(-8deg);
        }

        .orb__flag span {
            background: #ffffff;
            border-radius: 0.5px;
            filter: drop-shadow(0 0 1px rgba(0, 0, 0, 0.5));
        }

        .orb:hover { filter: brightness(1.12); }
        .orb:active { filter: brightness(0.92); }
        .orb:focus-visible { outline: 2px solid #ffd76a; outline-offset: 2px; }

        .tasks {
            display: flex;
            gap: 4px;
            flex: 1;
            min-width: 0;
        }

        .task {
            display: flex;
            align-items: center;
            gap: 7px;
            min-width: 0;
            max-width: 190px;
            height: 30px;
            padding: 0 10px;
            border-radius: 3px;
            border: 1px solid rgba(255, 255, 255, 0.32);
            background: linear-gradient(180deg, rgba(255, 255, 255, 0.26) 0%, rgba(255, 255, 255, 0.06) 100%);
            color: #fff;
            font-size: 12px;
            text-shadow: 0 1px 2px rgba(0, 0, 0, 0.6);
            cursor: pointer;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            transition: background 0.15s ease, box-shadow 0.15s ease;
        }

        .task:hover {
            background: linear-gradient(180deg, rgba(255, 255, 255, 0.4) 0%, rgba(255, 255, 255, 0.14) 100%);
            box-shadow: 0 0 10px rgba(190, 220, 255, 0.55);
        }

        .task.is-active {
            background: linear-gradient(180deg, rgba(255, 255, 255, 0.16) 0%, rgba(255, 255, 255, 0.05) 100%);
            box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.22);
        }

        .task__dot {
            width: 13px;
            height: 13px;
            flex-shrink: 0;
            border-radius: 2px;
            background: linear-gradient(135deg, var(--accent-bright), var(--accent-deep));
            box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.45);
        }

        .clock {
            display: flex;
            align-items: center;
            gap: 10px;
            height: 30px;
            padding: 0 11px;
            border-radius: 3px;
            border: 1px solid rgba(255, 255, 255, 0.32);
            background: linear-gradient(180deg, rgba(255, 255, 255, 0.24) 0%, rgba(255, 255, 255, 0.05) 100%);
            color: #fff;
            font-size: 12px;
            text-shadow: 0 1px 2px rgba(0, 0, 0, 0.6);
            font-variant-numeric: tabular-nums;
            flex-shrink: 0;
        }

        /* =============================================================
                   Float animation — every window rocks in 3D on its own phase.
                   Parent holds the perspective; the child owns the transform so
                   the Z-lift, tilt and roll compose into one matrix.
                   ============================================================= */
                .window-layer {
                    perspective: 1100px;
                    perspective-origin: 50% 45%;
                }

                @keyframes winFloat {
                    0% {
                        transform:
                            translate3d(calc(var(--drift-x, 4px) * -0.5), 0, var(--z-back, -26px))
                            rotateX(calc(var(--tilt, 3deg) * -1))
                            rotateY(calc(var(--yaw, 0.35) * var(--tilt, 3deg) * -1))
                            rotateZ(calc(var(--roll, 1.1deg) * -1));
                    }
                    50% {
                        transform:
                            translate3d(var(--drift-x, 4px), var(--drift-y, -7px), var(--z-front, 20px))
                            rotateX(var(--tilt, 3deg))
                            rotateY(calc(var(--yaw, 0.35) * var(--tilt, 3deg)))
                            rotateZ(var(--roll, 1.1deg));
                    }
                    100% {
                        transform:
                            translate3d(calc(var(--drift-x, 4px) * -0.5), 0, var(--z-back, -26px))
                            rotateX(calc(var(--tilt, 3deg) * -1))
                            rotateY(calc(var(--yaw, 0.35) * var(--tilt, 3deg) * -1))
                            rotateZ(calc(var(--roll, 1.1deg) * -1));
                    }
                }

                /* Freeze the bob while the pfp flies into the avatar, so the two
           read as one object instead of two things at slightly different
           offsets. */
        html.js.landing .win {
            animation-play-state: paused !important;
        }

        /* Reveal is opacity-only so it never fights winFloat over `transform`. */
                @keyframes winReveal {
                    from { opacity: 0; }
                    to   { opacity: 1; }
                }

                @keyframes taskbarReveal {
                    from { opacity: 0; transform: translateY(42px); }
                    to   { opacity: 1; transform: translateY(0); }
                }

                html.js .win { opacity: 0; }
                html.js .taskbar { opacity: 0; }

                /* Windows fade in one after another as the intro hands over. */
                html.js.revealed .win {
                    opacity: 1;
                    animation:
        winFloat var(--float-dur, 7s) ease-in-out var(--float-delay, 0s) infinite,
        winReveal 0.55s ease-out var(--reveal-delay, 0s) both;
                }

                html.js.revealed .taskbar {
                    opacity: 1;
                    animation: taskbarReveal 0.5s ease-out 0.5s both;
                }

                @media (prefers-reduced-motion: reduce) {
                    html.js .win,
                    html.js .taskbar {
        opacity: 1;
        animation: none;
                    }
                }

        /* The 3D tilt swings the windows wider than their box, so trim the
        side padding a touch on small screens to avoid a horizontal scrollbar. */
                @media (max-width: 620px) {
               .desktop { padding: 1.25rem 1.5rem 6rem; }
         .win__body { padding: 13px 13px 6px; }
               .about-top { flex-direction: column; align-items: flex-start; gap: 12px; }
             .task { max-width: 120px; }
            .tasks { gap: 3px; }
                }

        @media (max-width: 420px) {
            .clock { display: none; }
        }
    </style>
</head>
<body>

    <!-- ============ INTRO SEQUENCE ============ -->
    <div class="intro" id="intro" aria-hidden="true">
        <div class="intro__fly" id="introFly">
            <div class="intro__fx">
                <span class="ring ring--1"></span>
                <span class="ring ring--2"></span>
                <span class="spark spark--1"></span>
                <span class="spark spark--2"></span>
                <span class="spark spark--3"></span>
                <span class="spark spark--4"></span>
            </div>
            <img src="profile.png" alt="" class="intro__pfp" id="introPfp" draggable="false">
        </div>

        <div class="intro__text" id="introText">
            <h2 class="intro__title" id="introTitle"></h2>
            <p class="intro__handle" id="introHandle">@devid.bitt.five</p>
        </div>

        <div class="intro__hint" id="introHint">click to skip</div>
    </div>

    <!-- ============ DESKTOP ============ -->
    <main class="desktop" id="desktop">

        <div class="window-layer" id="windowLayer">

            <!-- About Me -->
                        <section class="win" data-win="About" style="--float-dur: 7.4s; --float-delay: -0.6s; --drift-x: 12px; --drift-y: -16px; --tilt: 4.2deg; --yaw: 0.30; --roll: 1.4deg; --z-front: 22px; --z-back: -30px; --reveal-delay: 0.05s;">
                <header class="win__bar">
                    <span class="win__icon" aria-hidden="true">&#9670;</span>
                    <span class="win__title">About Me</span>
                    <span class="win__ctrls">
                        <button class="win__btn win__btn--min" type="button" aria-label="Minimize"><i></i></button>
                        <button class="win__btn win__btn--max" type="button" aria-label="Maximize"><i></i></button>
                        <button class="win__btn win__btn--close" type="button" aria-label="Close"><i></i></button>
                    </span>
                </header>

    <!-- ============ TASKBAR ============ -->
    <div class="taskbar">
        <button class="orb" id="orb" type="button" aria-label="Start">
            <span class="orb__flag" aria-hidden="true"><span></span><span></span><span></span><span></span></span>
        </button>
        <div class="tasks" id="tasks"></div>
        <div class="clock" id="clock">--:--</div>
    </div>

    <script>
    (function () {
        const NAME = 'Devid';
        const HANDLE = '@devid.bitt.five';

        document.documentElement.classList.add('js');
        document.getElementById('introHandle').textContent = HANDLE;
        document.getElementById('introTitle').innerHTML =
            NAME.split('').map((c, i) => '<span class="intro__char" style="--i:' + i + '">' + c + '</span>').join('');

        /* ---------------- Taskbar clock ---------------- */
        const clock = document.getElementById('clock');
        function tick() {
            const n = new Date();
            let h = n.getHours();
            const ampm = h >= 12 ? 'PM' : 'AM';
            h = h % 12 || 12;
            const m = String(n.getMinutes()).padStart(2, '0');
            clock.textContent = h + ':' + m + ' ' + ampm;
        }
        tick();
        setInterval(tick, 15000);

        /* ---------------- Taskbar buttons from the windows ---------------- */
        const tasks = document.getElementById('tasks');
        const wins = [...document.querySelectorAll('.win')];
        const buttons = new Map();

        wins.forEach((w) => {
            const name = w.dataset.win;
            const b = document.createElement('button');
            b.className = 'task';
            b.type = 'button';
            b.innerHTML = '<span class="task__dot"></span>' + name;
            b.addEventListener('click', () => {
                w.scrollIntoView({ behavior: 'smooth', block: 'center' });
                focusWin(w);
            });
            tasks.appendChild(b);
            buttons.set(w, b);
        });

        function focusWin(w) {
            wins.forEach((x) => x.classList.remove('win--focus'));
            buttons.forEach((b, win) => b.classList.toggle('is-active', win === w));
            w.classList.add('win--focus');
        }

        /* Track which window the pointer is over -> "active" task. */
        wins.forEach((w) => {
            w.addEventListener('mouseenter', () => focusWin(w));
            w.addEventListener('mouseleave', () => w.classList.remove('win--focus'));
        });

        /* Caption buttons: close actually closes, min/max are decorative
           but give the same affordance feedback. */
        document.querySelectorAll('.win').forEach((w) => {
            const [min, max, close] = w.querySelectorAll('.win__btn');
            close.addEventListener('click', () => {
                w.style.transition = 'opacity .18s ease, transform .18s ease';
                w.style.opacity = '0';
                w.style.transform = 'scale(.94)';
                setTimeout(() => {
                    w.hidden = true;
                    w.style.opacity = '';
                    w.style.transform = '';
                    w.style.transition = '';
                    const b = buttons.get(w);
                    if (b) b.remove();
                }, 190);
            });
            min.addEventListener('click', () => w.classList.toggle('win--min'));
            max.addEventListener('click', () => w.classList.toggle('win--max'));
        });

        /* Start orb: a tiny bit of Aero sparkle. */
        const orb = document.getElementById('orb');
        orb.addEventListener('click', () => {
            document.getElementById('desktop').scrollIntoView({ behavior: 'smooth' });
            wins.forEach((w, i) => {
                setTimeout(() => {
                    w.animate(
                        [
                            { transform: 'translateX(-6px)' },
                            { transform: 'translateX(0)' }
                        ],
                        { duration: 320, easing: 'ease-out' }
                    );
                }, i * 60);
            });
        });

        /* ---------------- Intro sequence ---------------- */
        const reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
        const intro = document.getElementById('intro');
        const fly = document.getElementById('introFly');
        const text = document.getElementById('introText');
        const hint = document.getElementById('introHint');
        const target = document.querySelector('.avatar');

        let done = false;
        function finish() {
            if (done) return;
            done = true;
            try { sessionStorage.setItem('introSeen', '1'); } catch (e) {}
            intro.classList.add('intro--gone');
            document.body.classList.remove('is-intro');
            document.documentElement.classList.add('revealed');
        }

        let seen = false;
        try { seen = sessionStorage.getItem('introSeen') === '1'; } catch (e) {}
        if (seen || reduce) { finish(); return; }

        const wait = (ms) => new Promise((r) => setTimeout(r, ms));

        // The avatar carries no scale transform of its own — the float is a
                // pure translate on the window — so the live rect already reflects
                // where the pfp visually sits. No neutralising needed.
                function measureTarget() {
                    const t = target.getBoundingClientRect();
                    // offsetWidth is layout width, so the 3D tilt doesn't inflate it.
                    const size = target.offsetWidth || 104;
                    // The rect centre stays true under rotation, so this is safe.
                    return {
                        size: size,
                        x: t.left + t.width / 2 - window.innerWidth / 2,
                        y: t.top + t.height / 2 - window.innerHeight / 2
                    };
                }

        setTimeout(finish, 8000);
        window.addEventListener('error', finish);

        (async function play() {
            const m = measureTarget();
            const size = m.size;
            const heroScale = window.innerWidth <= 620 ? 1.5 : 2.1;
            const spin = (Math.random() > 0.5 ? '' : '-') + (10 + Math.random() * 14) + 'deg';
            const drop = Math.round((size * heroScale) / 2 + 34);

            fly.style.setProperty('--size', size + 'px');
            fly.style.setProperty('--srot', spin);
            text.style.setProperty('--drop', drop + 'px');
            fly.style.setProperty('--tx', m.x.toFixed(1) + 'px');
            fly.style.setProperty('--ty', m.y.toFixed(1) + 'px');

            requestAnimationFrame(() => {
                intro.classList.add('intro--stage');
                hint.classList.add('intro__hint--live');
            });

            await wait(1500);
            intro.classList.add('intro--landed');
            await wait(150);
            text.classList.add('intro__text--in');
            await wait(1250);
            fly.classList.add('intro__fly--rest');
            await wait(500);

            // Pause the bob, then re-measure so the flight path targets the
                        // window's true resting position rather than a float offset.
                        document.documentElement.classList.add('landing');
                        await wait(60);
                        const m2 = measureTarget();
                        fly.style.setProperty('--tx', m2.x.toFixed(1) + 'px');
                        fly.style.setProperty('--ty', m2.y.toFixed(1) + 'px');

                        intro.classList.add('intro--exit');
                        // Hold the bob until the pfp has fully faded (opacity completes
                        // at ~1.25s into the exit), so the resume is never visible.
                        await wait(1350);
                        document.documentElement.classList.remove('landing');
                        finish();
        })();

        ['click', 'keydown', 'touchstart'].forEach((ev) =>
            window.addEventListener(ev, finish, { once: true })
        );
    })();
    </script>
